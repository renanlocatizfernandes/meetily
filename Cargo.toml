[workspace]
resolver = "2"
members = [
    "frontend/src-tauri",
    "llama-helper"
]

# Shared workspace settings
[workspace.package]
edition = "2021"
rust-version = "1.77"

# Shared dependencies that can be inherited by workspace members
[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.32.0", features = ["full"] }

# Release builds (every script in scripts/release/ builds through this workspace).
# Thin LTO and one codegen unit make the binary smaller and a little faster, at the
# cost of a longer build; symbols are stripped from the shipped binary. Panics keep
# unwinding: Tauri and Tokio rely on a panicking task not taking the app down.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
